name: skill-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 scripts/lint_skills.py
      - name: Check published skill inventory and required resources
        run: python3 scripts/check_distribution.py
      - name: Check functional design fixtures and source snapshots
        run: python3 -m unittest discover -s skills/ui-design-spec/scripts -p 'test_*.py'
      - name: Check complete functional design example
        run: python3 skills/ui-design-spec/scripts/validate_functional_design.py evals/fixtures/ui-design-spec/agent-browser/docs/functional-design
